name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14.2'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14.2'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watch=false

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          MOVIE_API_URL: ${{ secrets.MOVIE_API_URL }}
        run: |
          if [ -z "$MOVIE_API_URL" ]; then
            echo "::error::Set the MOVIE_API_URL repository secret to the public backend URL."
            exit 1
          fi
          case "$MOVIE_API_URL" in
            http://*|https://*) ;;
            *) echo "::error::MOVIE_API_URL must start with http:// or https://."; exit 1 ;;
          esac
          case "$MOVIE_API_URL" in
            *localhost*|*127.0.0.1*)
              echo "::error::MOVIE_API_URL must be reachable outside this runner, not localhost."
              exit 1
              ;;
          esac
          MOVIE_API_URL="${MOVIE_API_URL%/}"
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_URL" \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            starter/frontend

      - name: Push Docker image to ECR
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: frontend
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to Kubernetes
        run: |
          cd starter/frontend/k8s
          kustomize edit set image frontend=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend --timeout=180s

      - name: Wait for frontend address
        run: |
          for attempt in $(seq 1 120); do
            address=$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -z "$address" ]; then
              address=$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            fi
            if [ -n "$address" ]; then
              echo "Frontend URL: http://$address"
              curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "http://$address/"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for the frontend LoadBalancer address."
          kubectl get service frontend -o wide
          exit 1
